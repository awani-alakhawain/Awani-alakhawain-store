<body>

<header>
  <div>
 <img
      src="https://raw.githubusercontent.com/awani-alakhawain/Awani-alakhawain-store/refs/heads/main/587681220_17951617638049632_8425599764459275730_n.jpg"
      alt="أواني الأخوين"
      style="width:100%; height:180px; object-fit:contain;"
    >
 

    <small>متجر الأواني المنزلية</small>
  </div>
  <button onclick="openCart()">🛒 السلة <b id="count">0</b></button>
</header>

<main>

<section class="hero">
  <h2>مرحبا بكم 👋</h2>
  <p>منتجات منزلية بأثمنة مناسبة والدفع عند الاستلام.</p>
</section>

<div class="tools">
  <input id="search" placeholder="🔎 ابحث عن منتج">
  <select id="cat">
    <option value="">كل الفئات</option>
  </select>
</div>

<section id="products" class="grid"></section>

</main>

<!-- السلة -->
<div id="cart" class="panel">
  <div class="panelhead">
    <h2>السلة</h2>
    <button onclick="closeCart()">✕</button>
  </div>

  <div id="items"></div>

  <h3>المجموع: <span id="total">0</span> درهم</h3>

  <form id="order">
    <input name="name" required placeholder="الاسم الكامل">
    <input name="phone" required placeholder="رقم الهاتف">
    <textarea name="address" required placeholder="العنوان"></textarea>
    <button type="submit">إرسال الطلب عبر WhatsApp</button>
  </form>
</div>

<!-- تسجيل الدخول للإدارة -->
<div id="login" class="panel">

  <div class="panelhead">
    <h2>🔐 دخول الإدارة</h2>
    <button onclick="closeLogin()">✕</button>
  </div>

  <form id="loginForm">

    <input
      id="loginEmail"
      type="email"
      required
      placeholder="الإيميل"
    >

    <input
      id="loginPassword"
      type="password"
      required
      placeholder="كلمة السر"
    >

    <button type="submit">
      دخول
    </button>

  </form>

  <p id="loginMessage"></p>

</div>

<!-- إدارة المتجر -->
<div id="admin" class="panel">

  <div class="panelhead">
    <h2>⚙️ إدارة المتجر</h2>
    <button onclick="closeAdmin()">✕</button>
  </div>

  <p class="hint">
    من هنا تقدر تزيد وتعدل المنتجات.
  </p>

  <form id="productForm">

    <input type="hidden" id="editId">

    <input
      id="pname"
      required
      placeholder="اسم المنتج"
    >

    <input
      id="pprice"
      type="number"
      required
      placeholder="الثمن بالدرهم"
    >

    <input
      id="pcat"
      required
      placeholder="الفئة مثلا: أباريق"
    >

    <textarea
      id="pdesc"
      placeholder="وصف المنتج"
    ></textarea>

    <input
      id="pimage"
      type="url"
      placeholder="رابط صورة المنتج"
    >

    <input
      id="pemoji"
      placeholder="رمز/إيموجي مثلا 🫖"
    >

    <button type="submit">
      حفظ المنتج
    </button>

  </form>

  <div id="adminList"></div>

</div>

<button class="adminBtn" onclick="openLogin()">
  ⚙️ إدارة المنتجات
</button>

<footer>
  📞 0718000706 — أواني الأخوين
</footer>
